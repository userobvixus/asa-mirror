name: Sync and Clean ASA Images

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  sync-and-clean:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync and Clean Images
        run: |
          for TAG in asa asa-latest asa-owl; do
            echo "------------------------------------------------------"
            echo "Traitement du tag : $TAG"
            echo "------------------------------------------------------"
            
            # 1. Pull de l'image
            docker pull ghcr.io/gameservershub-llc/nonfree:$TAG

            # 2. Tentative d'extraction du script (on teste plusieurs chemins possibles)
            # On utilise || true pour éviter que le script s'arrête en cas d'erreur ici
            docker run --rm --entrypoint cat ghcr.io/gameservershub-llc/nonfree:$TAG /entrypoint.sh > entrypoint.sh 2>/dev/null || \
            docker run --rm --entrypoint cat ghcr.io/gameservershub-llc/nonfree:$TAG /start.sh > entrypoint.sh 2>/dev/null || true

            # 3. Si le fichier existe, on le nettoie
            if [ -s entrypoint.sh ]; then
              echo "Nettoyage des mentions GSH/Discord..."
              sed -i '/[Mm]ade [Bb]y/d' entrypoint.sh
              sed -i '/[Uu]pdated [Bb]y/d' entrypoint.sh
              sed -i '/[Pp]owered [Bb]y/d' entrypoint.sh
              sed -i '/[Dd]iscord/d' entrypoint.sh
              sed -i '/[Gg][Ss][Hh]/d' entrypoint.sh
              
              # Ajout d'une petite touche CroustyCloud (optionnel)
              echo 'echo -e "\e[35mPropulsé par CroustyCloud\e[0m"' >> entrypoint.sh

              # 4. Reconstruction de l'image avec le script nettoyé
              cat <<EOF > Dockerfile
              FROM ghcr.io/gameservershub-llc/nonfree:$TAG
              COPY entrypoint.sh /entrypoint.sh
              COPY entrypoint.sh /start.sh
              RUN chmod +x /entrypoint.sh /start.sh
          EOF
              docker build -t ghcr.io/userobvixus/nonfree:$TAG .
            else
              echo "Script de démarrage non trouvé, simple copie de l'image sans nettoyage."
              docker tag ghcr.io/gameservershub-llc/nonfree:$TAG ghcr.io/userobvixus/nonfree:$TAG
            fi

            # 5. Push final
            docker push ghcr.io/userobvixus/nonfree:$TAG
            
            # Nettoyage des fichiers temporaires
            rm -f entrypoint.sh Dockerfile
          done

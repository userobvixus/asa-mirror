name: Sync and Clean ASA Images

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  sync-and-clean:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync and Clean Images
        run: |
          for TAG in asa asa-latest asa-owl; do
            echo "Nettoyage du tag : $TAG"
            
            # 1. Récupérer l'image originale
            docker pull ghcr.io/gameservershub-llc/nonfree:$TAG
            
            # 2. Créer un conteneur temporaire pour extraire le script de démarrage
            # Sur ces images, le script est généralement à la racine ou dans /
            docker run --rm --entrypoint cat ghcr.io/gameservershub-llc/nonfree:$TAG /entrypoint.sh > entrypoint.sh || \
            docker run --rm --entrypoint cat ghcr.io/gameservershub-llc/nonfree:$TAG /start.sh > entrypoint.sh

            # 3. Supprimer uniquement les lignes contenant les mentions indésirables
            # On ignore la casse (-i) pour attraper "Made By" ou "made by"
            sed -i '/[Mm]ade [Bb]y/d' entrypoint.sh
            sed -i '/[Uu]pdated [Bb]y/d' entrypoint.sh
            sed -i '/[Pp]owered [Bb]y/d' entrypoint.sh
            sed -i '/[Dd]iscord/d' entrypoint.sh
            sed -i '/[Gg][Ss][Hh]/d' entrypoint.sh

            # 4. Créer un Dockerfile temporaire pour reconstruire l'image avec le script modifié
            cat <<EOF > Dockerfile
            FROM ghcr.io/gameservershub-llc/nonfree:$TAG
            COPY entrypoint.sh /entrypoint.sh
            COPY entrypoint.sh /start.sh
            RUN chmod +x /entrypoint.sh /start.sh
            EOF

            # 5. Build et Push sur ton compte
            docker build -t ghcr.io/userobvixus/nonfree:$TAG .
            docker push ghcr.io/userobvixus/nonfree:$TAG
            
            # Nettoyage
            rm entrypoint.sh Dockerfile
          done

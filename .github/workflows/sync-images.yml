name: Sync and Clean ASA Images

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  sync-and-clean:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync and Clean Images
        run: |
          for TAG in asa asa-latest asa-owl; do
            echo "Nettoyage du tag : $TAG"
            
            # 1. Récupérer l'image source
            docker pull ghcr.io/gameservershub-llc/nonfree:$TAG

            # 2. Créer un conteneur temporaire pour extraire le script de démarrage dynamiquement
            # On récupère le chemin du script via l'inspect de Docker
            SCRIPT_PATH=$(docker inspect --format='{{join .Config.Entrypoint " "}}' ghcr.io/gameservershub-llc/nonfree:$TAG | cut -d' ' -f1)
            echo "Script détecté : $SCRIPT_PATH"

            if [ -n "$SCRIPT_PATH" ]; then
              # Extraire le script
              docker run --rm --entrypoint cat ghcr.io/gameservershub-llc/nonfree:$TAG "$SCRIPT_PATH" > cleaned_script.sh
              
              # Nettoyage chirurgical
              sed -i '/[Mm]ade [Bb]y/d; /[Uu]pdated [Bb]y/d; /[Pp]owered [Bb]y/d; /[Dd]iscord/d; /[Gg][Ss][Hh]/d' cleaned_script.sh
              echo 'echo -e "\e[35mPropulsé par CroustyCloud\e[0m"' >> cleaned_script.sh

              # 3. Reconstruire l'image proprement
              cat <<EOF > Dockerfile
              FROM ghcr.io/gameservershub-llc/nonfree:$TAG
              COPY cleaned_script.sh $SCRIPT_PATH
              RUN chmod +x $SCRIPT_PATH
          EOF
              docker build -t ghcr.io/userobvixus/nonfree:$TAG .
            else
              echo "Impossible de trouver le script de démarrage, simple miroir."
              docker tag ghcr.io/gameservershub-llc/nonfree:$TAG ghcr.io/userobvixus/nonfree:$TAG
            fi

            # 4. Push
            docker push ghcr.io/userobvixus/nonfree:$TAG
            rm -f cleaned_script.sh Dockerfile
          done
